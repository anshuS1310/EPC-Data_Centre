<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body,html{width:100%;height:100%;background:#c8d4c0}
    #map{width:100%;height:100vh}
    .leaflet-popup-content-wrapper{background:rgba(15,23,42,.97)!important;border:1px solid rgba(100,116,139,.6)!important;border-radius:10px!important;box-shadow:0 8px 24px rgba(0,0,0,.5)!important;padding:0!important}
    .leaflet-popup-content{margin:0!important;color:#e2e8f0}
    .leaflet-popup-tip{background:rgba(15,23,42,.97)!important}
    .leaflet-control-zoom{border-radius:8px!important;border:none!important;box-shadow:0 2px 12px rgba(0,0,0,.2)!important;overflow:hidden}
    .leaflet-control-zoom a{background:white!important;color:#334155!important;border-color:#e2e8f0!important;width:30px!important;height:30px!important;line-height:28px!important;font-weight:bold}
    .leaflet-control-zoom a:hover{background:#f1f5f9!important}
    .leaflet-control-attribution{font-size:8px!important;opacity:.6}
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    function arc(from,to,n){
      n=n||60;
      var r=function(d){return d*Math.PI/180},d2=function(r){return r*180/Math.PI};
      var a=r(from[0]),b=r(from[1]),c=r(to[0]),e=r(to[1]);
      var f=2*Math.asin(Math.sqrt(Math.pow(Math.sin((c-a)/2),2)+Math.cos(a)*Math.cos(c)*Math.pow(Math.sin((e-b)/2),2)));
      if(f<.0001)return[from,to];
      var pts=[];
      for(var i=0;i<=n;i++){var t=i/n,A=Math.sin((1-t)*f)/Math.sin(f),B=Math.sin(t*f)/Math.sin(f);var x=A*Math.cos(a)*Math.cos(b)+B*Math.cos(c)*Math.cos(e);var y=A*Math.cos(a)*Math.sin(b)+B*Math.cos(c)*Math.sin(e);var z=A*Math.sin(a)+B*Math.sin(c);pts.push([d2(Math.atan2(z,Math.sqrt(x*x+y*y))),d2(Math.atan2(y,x))]);}
      return pts;
    }
    var map=L.map('map',{center:[22,82],zoom:4,zoomControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{subdomains:['a','b','c'],attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:18,keepBuffer:4}).addTo(map);
    var layers=[];
    function clear(){layers.forEach(function(l){try{map.removeLayer(l)}catch(e){}});layers=[];}
    function dcIcon(){return L.divIcon({className:'',iconSize:[34,42],iconAnchor:[17,42],popupAnchor:[0,-44],html:'<svg viewBox="0 0 34 42" width="34" height="42" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 2px 8px rgba(34,211,238,.8))"><path d="M17 1C8.7 1 2 7.7 2 16c0 10 15 25 15 25s15-15 15-25C32 7.7 25.3 1 17 1z" fill="#083344" stroke="#22d3ee" stroke-width="2.2"/><rect x="8" y="9" width="18" height="12" rx="1.5" fill="#22d3ee" opacity=".9"/><rect x="10" y="11" width="4" height="3" rx=".5" fill="#083344"/><rect x="16" y="11" width="4" height="3" rx=".5" fill="#083344"/><rect x="22" y="11" width="2" height="8" rx=".5" fill="#083344"/><text x="17" y="28" text-anchor="middle" font-size="6" font-weight="bold" fill="#22d3ee" font-family="monospace">DC</text></svg>'});}
    function shipIcon(atRisk,sel){var c=atRisk?'#f43f5e':'#10b981',bg=atRisk?'#4c0519':'#022c22',gl=atRisk?'rgba(244,63,94,.7)':'rgba(16,185,129,.7)',sz=sel?40:32,ex=sel?'<circle cx="20" cy="18" r="13" fill="none" stroke="'+c+'" stroke-width="1.5" opacity=".4"/>':'',sc=sel?'transform:scale(1.12);transform-origin:bottom center;':'';return L.divIcon({className:'',iconSize:[sz,sz+10],iconAnchor:[sz/2,sz+10],popupAnchor:[0,-(sz+12)],html:'<svg viewBox="0 0 40 50" width="'+sz+'" height="'+(sz+10)+'" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 3px 8px '+gl+');'+sc+'"><path d="M20 2C11.2 2 4 9.2 4 18c0 12.5 16 32 16 32s16-19.5 16-32C36 9.2 28.8 2 20 2z" fill="'+bg+'" stroke="'+c+'" stroke-width="2.2"/><circle cx="20" cy="18" r="9" fill="'+c+'" opacity="'+(sel?'1':'.85')+'"/><text x="20" y="23" text-anchor="middle" font-size="11" fill="white">&#128674;</text>'+ex+'</svg>'});}
    function update(d){
      clear();
      var dc=d.dcCoords;
      var m=L.marker(dc,{icon:dcIcon(),zIndexOffset:1000}).bindPopup('<div style="font-family:monospace;font-size:11px;padding:7px 9px;color:#e2e8f0"><b style="color:#22d3ee">'+d.projectName+'</b><br/><span style="color:#64748b">'+d.tierRating+' &middot; '+d.capacityMw+' MW</span></div>',{closeButton:false}).addTo(map);
      layers.push(m);
      d.shipments.forEach(function(s){
        if(!s.coords)return;
        var marker=L.marker(s.coords,{icon:shipIcon(s.atRisk,s.isSelected)})
          .bindPopup('<div style="font-family:monospace;font-size:10px;padding:7px 9px;color:#e2e8f0"><b style="color:'+(s.atRisk?'#f43f5e':'#10b981')+'">'+s.name+'</b><br/><span style="color:#64748b">'+s.po+'</span><br/>'+(s.atRisk?'<b style="color:#f43f5e">&#9679; AT RISK</b>':'<b style="color:#10b981">&#9679; ON TIME</b>')+'<br/><span style="color:#94a3b8">From: '+s.location+'</span></div>',{closeButton:false})
          .on('click',function(){window.parent.postMessage({type:'SELECT_SHIPMENT',id:s.id},'*');})
          .addTo(map);
        layers.push(marker);
        if(s.isSelected){map.fitBounds(L.latLngBounds([s.coords,dc]),{padding:[60,60],maxZoom:6,animate:true});}
        var a2=arc(s.coords,dc,80),col=s.atRisk?'#f43f5e':'#06b6d4';
        layers.push(L.polyline(a2,{color:s.atRisk?'#f43f5e':'#10b981',weight:s.isSelected?8:5,opacity:.15}).addTo(map));
        layers.push(L.polyline(a2,{color:col,weight:s.isSelected?2.5:1.8,opacity:s.isSelected?.95:.6,dashArray:s.isSelected?null:'8,6'}).addTo(map));
      });
    }
    window.addEventListener('message',function(e){if(e.data&&e.data.type==='UPDATE_MAP')update(e.data.payload);});
    map.whenReady(function(){window.parent.postMessage({type:'MAP_READY'},'*');});
  </script>
</body>
</html>
